· 제시문은 세 편으로 짠다 — 【가】 한쪽 관점, 【나】 맞선 관점, 【다】 절충안이나 자료(표·설문).
  각 제시문은 3~6문장의 쉬운 글로 쓰고, 중학생이 아는 낱말만 쓴다. 배경지식이 없어도 읽을 수 있어야 한다.
· 논제는 둘로 나눈다.
  - 논제 1(40점 안팎, 300~400자) — 제시문·자료를 견주어 읽는 문제. "(가)와 (나)가 …를 어떻게 다르게 보는지 비교하시오",
    "자료 (다)에서 (가)를 뒷받침하는 근거와 (나)를 뒷받침하는 근거를 각각 찾아 수치와 함께 쓰시오".
  - 논제 2(60점 안팎, 600~700자) — 자기 주장을 세우는 문제. 발문 끝에
    "근거 두 가지 이상과 예상되는 반론·그에 대한 대답을 반드시 포함하시오"를 넣는다(중학교 논술의 핵심 조건이다).
· 주제는 학생이 당사자인 것으로 고른다 — 학교 규칙, 숙제, 스마트폰, AI 과제, 급식·일회용품, 동물원 같은 생활 소재.
· 자료를 넣을 때는 학생·학부모·교사처럼 집단을 나눠 응답이 엇갈리게 만들고,
  같은 자료가 (가)와 (나) 양쪽을 각각 뒷받침하도록 배치한다(어느 쪽 주장이든 만점이 가능해야 한다).
· 감점 기준(deduction_rules)에는 아래를 반드시 넣는다 — 학교 채점기준표의 표준 항목이다.

[출제 원칙 — 인과 연결 체계]
성취기준 → 핵심 개념 → 제시문 → 논제 → 평가 요소 → 채점 루브릭 → 감점 기준이

[제시문 원칙]
- 사실 오류·오개념이 없어야 한다 (과학·역사적 사실 검증).
- 학교급·학년 수준의 어휘와 길이 (제시문당 300~600자).
- 저작권 문제가 없도록 직접 작성한 지문을 사용하고, source_note에 "자체 제작" 또는 참고 맥락을 기록.
- 제시문은 (가)(나)(다)… 순서로 두고, 서로 다른 관점이나 층위를 맡게 한다 —
  한 제시문이 다른 제시문에 반론을 제기하거나, 앞의 원리를 적용할 사례를 제공하는 식으로 엮는다.
- 제목은 붙이지 않는다(title은 빈 문자열). 제목이 있으면 학생이 읽기 전에 논지를 알아 버린다.
- passage_note에 제시문 묶음의 출처·성격을 '※'로 시작하는 한 줄로 적는다. 이 문제지에 실제로 해당하는 내용만 쓴다.
  예: 수치·통계를 지어냈으면 그 사실을, 실존 사건·판례를 인용했으면 무엇을 근거로 삼았는지 밝힌다.
  (기본값: "※ 제시문은 출제자 집필문, 수치 자료는 출제용 가상 자료임")

[논제 원칙]
- 논제가 여러 개면 난이도와 요구 사고를 층으로 쌓는다:
  앞 논제는 제시문의 이해·비교, 뒤 논제는 적용·평가·반론 대응.
- 논제마다 points(배점)와 min_chars/max_chars(분량)를 따로 정한다.
  뒤 논제일수록 배점과 분량을 크게 잡는 것이 보통이다(예: 논제1 40점 700자, 논제2 60점 1,100자).
- 모든 논제 points의 합은 반드시 100점.
- 발문 끝에는 요구 사항을 구체적으로 적는다("반드시 …을 포함하시오", "…중 최소 두 편에서 근거를 끌어오시오").

[루브릭·감점 원칙 (100점 만점)]
- 루브릭 영역 배점의 합은 반드시 100점.
- 루브릭 항목마다 q에 어느 논제의 것인지 번호를 적는다(논제가 하나뿐이면 "1").
  한 논제에 속한 영역 배점의 합은 그 논제의 배점과 같아야 한다.
  영역 이름(area)에는 논제 번호를 넣지 않는다 — q가 그 역할을 한다.
- ★ rubric은 **questions의 모든 논제**에 대해 만든다 — 논제가 다섯이면 다섯 논제 전부의 루브릭 줄이 있어야 한다.
  뒤 논제라고 생략하거나 "같은 방식"이라고 넘기는 것을 금지한다. 루브릭이 없는 논제는 채점할 수 없다.
- ★ 한 논제에 루브릭 영역을 하나만 두는 것을 금지한다. 내용 영역을 나누고 거기에 표현력 영역을 더한다.
  한 논제의 rubric 줄 수는 3~5줄이며, 3줄로 고정하지 말고 배점과 발문이 요구하는 일의 수에 맞춘다.
  · 배점 20점 이하 → 내용 2개 + 표현력 = 3줄
  · 배점 21~40점  → 내용 3개 + 표현력 = 4줄
  · 배점 41점 이상 → 내용 3~4개 + 표현력 = 4~5줄
  발문이 요구하는 일이 그보다 많으면 그 수에 맞춰 늘린다(최대 5줄). 예를 들어
  "(1) 지적하고 (2) 관점을 채택해 정당화하며 (3) 반론에 대응하시오"는 세 가지를 요구하므로
  내용 영역이 최소 셋이다. 한 영역의 배점이 그 논제 배점의 절반을 넘지 않게 나눈다.
  ※ 아래 출력 예시의 rubric은 40점 논제를 4줄로 나눈 것이다. 그 줄 수를 그대로 베끼지 말고
    논제마다 위 기준으로 다시 셈한다.
  ※ 잘 만든 예 — 40점 논제: 개념 정의 10 / 개념 관계 설명 12 / 직업 생활 적용 10 / 표현력 8
                 60점 논제: 내용 요약 12 / 관점 비교 14 / 비판적 검토 12 / 반론 구성 10 / 표현력 12
    잘못 만든 예 — 40점 논제를 '요약 12 / 비교 14 / 표현력 14' 세 줄로 끝내는 것.
    내용 영역이 둘뿐이라 어디서 깎였는지 알 수 없고, 표현력 14점은 규격(아래)을 크게 넘는다.
- 표현력 영역의 배점은 그 논제 배점의 15% 안팎, 최대 6점(중학교는 8점)이다. 이보다 크게 잡지 않는다.
- ★ 내용 영역의 배점은 균등하게 나누지 않는다. 그 논제에서 무엇이 중요한지가 배점으로 드러나야 한다.
  · 발문이 마지막에 요구하는 일, 곧 그 논제의 목표가 되는 일(판단·논증·설계·비판)에 가장 큰 배점을 준다
    — 내용 배점의 35~45%.
  · 그 앞 단계(요약·정의·이해처럼 확인에 가까운 일)는 20~30%. 확인형 영역은 어떤 경우에도 논제 배점의 30%를 넘지 않는다.
  · 나머지(자료 인용, 사례 적용 같은 보조 요구)는 15~25%.
  · 가장 큰 내용 영역과 가장 작은 내용 영역의 배점 차이가 최소 4점은 나야 한다. 모두 같은 점수로 나누는 것을 금지한다.
  · 요소(elements)가 많은 영역일수록 배점을 크게 잡는다 — 확인할 것이 많다는 뜻이다.
  예) "(가)와 (나)를 요약하고, 이를 근거로 (다)를 비판하시오"(40점)
      → 요약 10(확인) · 근거 연결 8(보조) · 비판 16(목표) · 표현력 6.
  영역 이름(area)은 대학 채점기준표처럼 **평가하는 능력**으로 짓는다 —
  이해 / 요약 / 비교 / 자료 해석 / 적용 / 평가 / 비판적 검토 / 논증 / 정책 설계 / 반론 대응 / 표현력.
  나누는 기준은 발문이 요구하는 동작이다 — "…을 설명하고, …을 분석하시오"면 '설명'과 '분석'이 각각 한 영역이다.
  발문이 (1)(2)(3)으로 요구를 나눴다면 그 번호마다 영역을 하나씩 만든다.
  예) 논제 1(40점) → "이해"(16점) + "비교"(18점) + "표현력"(6점)
      논제 2(60점) → "적용"(22점) + "평가"(18점) + "논증"(14점) + "표현력"(6점)
  한 영역에 여러 능력을 뭉뚱그리면 채점자가 어디서 깎았는지 알 수 없다.
- 루브릭 항목마다 elements에 필수 요소를 적는다 — 답안에 있는지 없는지 바로 확인할 수 있는
  한 문장(40자 안쪽)으로, 요소 하나에 확인할 내용 하나만 담고 서로 겹치지 않게 한다.
  criteria(만점 기준)의 내용을 빠짐없이 나눈 것이어야 한다. 채점은 이 요소를 세는 방식으로 이루어진다.
- ★ 요소 개수는 배점에 맞춘다 — **요소 하나가 뒤집힐 때 움직이는 점수가 5점을 넘지 않아야 한다.**
  요소가 적고 배점이 크면 경계 요소 하나가 갈릴 때마다 점수가 크게 뛰어, 같은 답안을 다시 채점할 때마다
  점수가 달라진다. 최소 개수 = 올림(배점 ÷ 5), 최대 8개다.
  예) 24점 → 5개 이상 · 16점 → 4개 이상 · 14점 → 3개 이상 · 10점 → 2개 이상 · 6점 → 2개 이상.
  요소를 억지로 쪼개라는 뜻이 아니다 — 배점이 크다는 것은 확인할 내용이 그만큼 많다는 뜻이므로,
  만점 기준을 더 잘게 나누어 적으면 개수는 자연히 채워진다.
- ★ criteria·elements·level_examples는 판단 형용사로 쓰지 않는다 — '우수하다·충실하다·타당하다·미흡하다'는
  채점자마다 다르게 읽혀 점수가 흔들린다. 채점자가 답안에서 눈으로 확인할 수 있는 사실로 적는다:
  무엇을 몇 개 다뤘는가, 어떤 연결(인과·비교·반박)을 했는가, 어떤 근거를 인용했는가.
  예) "논지 전개가 우수함" (금지) → "(다)의 주장 두 가지를 각각 (가)의 개념을 근거로 반박함" (올바름)
- 요소를 적은 영역에는 element_scale(충족 개수 → 점수 표)도 함께 적는다.
  학교 채점기준표가 쓰는 방식이다 — 예: 요소 4개·배점 20점이면
  [{"min":4,"points":20},{"min":3,"points":15},{"min":2,"points":10},{"min":1,"points":5},{"min":0,"points":3}].
  · min은 '충족 요소 몇 개 이상'이며, 가장 큰 min의 points는 그 영역 배점과 같아야 한다.
  · 아래로 갈수록 점수가 낮아지게 하고, min:0에는 방향은 맞았으나 내용이 어긋난 답안에 줄
    부분 점수(배점의 10~15%)를 적는다. 부분 점수를 줄 필요가 없으면 min:0의 points는 0으로 둔다.
  · ★ 요소 개수마다 한 줄씩 빠짐없이 적고, **위아래 줄의 점수 차이가 5점을 넘지 않게** 고르게 나눈다.
    줄을 건너뛰거나 한 줄에서 점수가 크게 떨어지면 그만큼 채점이 거칠어진다.
- 감점 기준(deduction_rules)은 각각 특정 루브릭 영역(area)에 연결.
- 감점 기준에는 표준 코드명을 우선 사용한다:
  D-LEN 분량 오류, D-KEY 필수 키워드 누락, D-SYM 제시문 기호·개념 연결 오류,
  D-REP 반복 문장, D-COPY 제시문·모범답안 단순 베껴쓰기, D-LOGIC 논리 비약,
  D-CASE 사례 적용 부족, D-OPINION 자기 견해 부족, D-SPELL 맞춤법·띄어쓰기.
- 감점 기준은 일반론이 아니라 **이 문항에서 실제로 나올 오답 유형**으로 적는다.
  대학 채점기준표가 그렇게 쓴다 — "논제1에서 '인간관의 차이'를 다루지 않고 장단점만 나열",
  "자료 수치를 인용하지 않고 서술만으로 논증", "반론을 언급만 하고 대응 없이 종료",
  "자료가 지지하는 범위를 넘어 단정", "지표의 분모를 혼동" 같은 식이다.
  이런 문항별 오답 유형을 3~5개 만들고, 각각 desc에 무엇을 빠뜨렸는지 한 문장으로 적는다.
- 동일 오류 중복 감점 금지 원칙을 전제로 설계하고, 총 감점 상한을 -25점 안쪽으로 잡는다.
- cap_rules에는 핵심 요구 누락 시 최대점을 적는다. 예: 반론이 없으면 해당 문제 최대 70%,
  사례 적용이 없으면 해당 문제 최대 65%, 자기 견해가 없으면 해당 문제 최대 75%,
  필수 키워드가 절반 이상 빠지면 전체 최대 C수준.
- ★ 모범답안은 문제마다 따로 쓴다 — model_answer.parts에 문제 수만큼 넣고,
  각 part의 q에 문제 번호를, text에 그 문제의 모범답안 전문을 담는다.
  각 part는 그 문제의 min_chars~max_chars 분량을 지킨다. 문제를 건너뛰지 않는다.
- 모범답안과 다른 결론이라도 제시문에 근거한 논리가 타당하면 인정한다는 지침을
  model_answer.alternative_positions_guide에 구체적으로 서술.
