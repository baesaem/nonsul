· 제시문은 세 편으로 짠다 — 【가】 한쪽 관점, 【나】 맞선 관점, 【다】 절충안이나 자료(표·설문).
  각 제시문은 3~6문장의 쉬운 글로 쓰고, 중학생이 아는 낱말만 쓴다. 배경지식이 없어도 읽을 수 있어야 한다.
· 논제는 둘로 나눈다.
  - 논제 1(40점 안팎, 300~400자) — 제시문·자료를 견주어 읽는 문제. "(가)와 (나)가 …를 어떻게 다르게 보는지 비교하시오",
    "자료 (다)에서 (가)를 뒷받침하는 근거와 (나)를 뒷받침하는 근거를 각각 찾아 수치와 함께 쓰시오".
  - 논제 2(60점 안팎, 600~700자) — 자기 주장을 세우는 문제. 발문 끝에
    "근거 두 가지 이상과 예상되는 반론·그에 대한 대답을 반드시 포함하시오"를 넣는다(중학교 논술의 핵심 조건이다).
· 주제는 학생이 당사자인 것으로 고른다 — 학교 규칙, 숙제, 스마트폰, AI 과제, 급식·일회용품, 동물원 같은 생활 소재.
· 자료를 넣을 때는 학생·학부모·교사처럼 집단을 나눠 응답이 엇갈리게 만들고,
  같은 자료가 (가)와 (나) 양쪽을 각각 뒷받침하도록 배치한다(어느 쪽 주장이든 만점이 가능해야 한다).
· 감점 기준(deduction_rules)에는 아래를 반드시 넣는다 — 학교 채점기준표의 표준 항목이다.
  제시문 미활용 / 주장 불명확("상황에 따라 다르다"로 마무리) / 근거 부족(근거 1개) /
  반론 미고려(반론 없음, 반론만 쓰고 대답 없음) / 사실·수치 오독 / 문제 이탈 /
  같은 근거 반복·개조식 나열 / 맞춤법·비문. 감점은 범위(min~max)로 적는다.
· level_examples에는 점수 구간을 함께 적는다 —

[출제 원칙 — 인과 연결 체계]
성취기준 → 핵심 개념 → 제시문 → 논제 → 평가 요소 → 채점 루브릭 → 감점 기준이
하나의 인과 맥락으로 연결되어야 한다.

[제시문 원칙]
- 사실 오류·오개념이 없어야 한다 (과학·역사적 사실 검증).
- 학교급·학년 수준의 어휘와 길이 (제시문당 300~600자).
- 저작권 문제가 없도록 직접 작성한 지문을 사용하고, source_note에 "자체 제작" 또는 참고 맥락을 기록.
- 제시문은 (가)(나)(다)… 순서로 두고, 서로 다른 관점이나 층위를 맡게 한다 —
  한 제시문이 다른 제시문에 반론을 제기하거나, 앞의 원리를 적용할 사례를 제공하는 식으로 엮는다.
- 제목은 붙이지 않는다(title은 빈 문자열). 제목이 있으면 학생이 읽기 전에 논지를 알아 버린다.
- passage_note에 제시문 묶음의 출처·성격을 '※'로 시작하는 한 줄로 적는다. 이 문제지에 실제로 해당하는 내용만 쓴다.
  예: 수치·통계를 지어냈으면 그 사실을, 실존 사건·판례를 인용했으면 무엇을 근거로 삼았는지 밝힌다.
  (기본값: "※ 제시문은 출제자 집필문, 수치 자료는 출제용 가상 자료임")

[논제 원칙]
- 논제가 여러 개면 난이도와 요구 사고를 층으로 쌓는다:
  앞 논제는 제시문의 이해·비교, 뒤 논제는 적용·평가·반론 대응.
- 논제마다 points(배점)와 min_chars/max_chars(분량)를 따로 정한다.
  뒤 논제일수록 배점과 분량을 크게 잡는 것이 보통이다(예: 논제1 40점 700자, 논제2 60점 1,100자).
- 모든 논제 points의 합은 반드시 100점.
- 발문 끝에는 요구 사항을 구체적으로 적는다("반드시 …을 포함하시오", "…중 최소 두 편에서 근거를 끌어오시오").

[루브릭·감점 원칙 (100점 만점)]
- 루브릭 영역 배점의 합은 반드시 100점.
- 루브릭 항목마다 q에 어느 논제의 것인지 번호를 적는다(논제가 하나뿐이면 "1").
  한 논제에 속한 영역 배점의 합은 그 논제의 배점과 같아야 한다.
  영역 이름(area)에는 논제 번호를 넣지 않는다 — q가 그 역할을 한다.
- ★ rubric은 **questions의 모든 논제**에 대해 만든다 — 논제가 다섯이면 다섯 논제 전부의 루브릭 줄이 있어야 한다.
  뒤 논제라고 생략하거나 "같은 방식"이라고 넘기는 것을 금지한다. 루브릭이 없는 논제는 채점할 수 없다.
- ★ 한 논제에 루브릭 영역을 하나만 두는 것을 금지한다. 내용 영역을 나누고 거기에 표현력 영역을 더한다.
  한 논제의 rubric 줄 수는 3~5줄이며, 3줄로 고정하지 말고 배점과 발문이 요구하는 일의 수에 맞춘다.
  · 배점 20점 이하 → 내용 2개 + 표현력 = 3줄
  · 배점 21~40점  → 내용 3개 + 표현력 = 4줄
  · 배점 41점 이상 → 내용 3~4개 + 표현력 = 4~5줄
  발문이 요구하는 일이 그보다 많으면 그 수에 맞춰 늘린다(최대 5줄). 예를 들어
  "(1) 지적하고 (2) 관점을 채택해 정당화하며 (3) 반론에 대응하시오"는 세 가지를 요구하므로
  내용 영역이 최소 셋이다. 한 영역의 배점이 그 논제 배점의 절반을 넘지 않게 나눈다.
  ※ 아래 출력 예시의 rubric은 40점 논제를 4줄로 나눈 것이다. 그 줄 수를 그대로 베끼지 말고
    논제마다 위 기준으로 다시 셈한다.
  ※ 잘 만든 예 — 40점 논제: 개념 정의 10 / 개념 관계 설명 12 / 직업 생활 적용 10 / 표현력 8
                 60점 논제: 내용 요약 12 / 관점 비교 14 / 비판적 검토 12 / 반론 구성 10 / 표현력 12
    잘못 만든 예 — 40점 논제를 '요약 12 / 비교 14 / 표현력 14' 세 줄로 끝내는 것.
    내용 영역이 둘뿐이라 어디서 깎였는지 알 수 없고, 표현력 14점은 규격(아래)을 크게 넘는다.
- 표현력 영역의 배점은 그 논제 배점의 15% 안팎, 최대 6점(중학교는 8점)이다. 이보다 크게 잡지 않는다.
- ★ 내용 영역의 배점은 균등하게 나누지 않는다. 그 논제에서 무엇이 중요한지가 배점으로 드러나야 한다.
  · 발문이 마지막에 요구하는 일, 곧 그 논제의 목표가 되는 일(판단·논증·설계·비판)에 가장 큰 배점을 준다
    — 내용 배점의 35~45%.
  · 그 앞 단계(요약·정의·이해처럼 확인에 가까운 일)는 20~30%. 확인형 영역은 어떤 경우에도 논제 배점의 30%를 넘지 않는다.
  · 나머지(자료 인용, 사례 적용 같은 보조 요구)는 15~25%.
  · 가장 큰 내용 영역과 가장 작은 내용 영역의 배점 차이가 최소 4점은 나야 한다. 모두 같은 점수로 나누는 것을 금지한다.
  · 요소(elements)가 많은 영역일수록 배점을 크게 잡는다 — 확인할 것이 많다는 뜻이다.
  예) "(가)와 (나)를 요약하고, 이를 근거로 (다)를 비판하시오"(40점)
      → 요약 10(확인) · 근거 연결 8(보조) · 비판 16(목표) · 표현력 6.
  영역 이름(area)은 대학 채점기준표처럼 **평가하는 능력**으로 짓는다 —
  이해 / 요약 / 비교 / 자료 해석 / 적용 / 평가 / 비판적 검토 / 논증 / 정책 설계 / 반론 대응 / 표현력.
  나누는 기준은 발문이 요구하는 동작이다 — "…을 설명하고, …을 분석하시오"면 '설명'과 '분석'이 각각 한 영역이다.
  발문이 (1)(2)(3)으로 요구를 나눴다면 그 번호마다 영역을 하나씩 만든다.
  예) 논제 1(40점) → "이해"(16점) + "비교"(18점) + "표현력"(6점)
      논제 2(60점) → "적용"(22점) + "평가"(18점) + "논증"(14점) + "표현력"(6점)
  한 영역에 여러 능력을 뭉뚱그리면 채점자가 어디서 깎았는지 알 수 없다.
- 루브릭 항목마다 elements에 필수 요소를 적는다 — 답안에 있는지 없는지 바로 확인할 수 있는
  한 문장(40자 안쪽)으로, 요소 하나에 확인할 내용 하나만 담고 서로 겹치지 않게 한다.
  criteria(만점 기준)의 내용을 빠짐없이 나눈 것이어야 한다. 채점은 이 요소를 세는 방식으로 이루어진다.
- ★ 요소 개수는 배점에 맞춘다 — **요소 하나가 뒤집힐 때 움직이는 점수가 5점을 넘지 않아야 한다.**
  요소가 적고 배점이 크면 경계 요소 하나가 갈릴 때마다 점수가 크게 뛰어, 같은 답안을 다시 채점할 때마다
  점수가 달라진다. 최소 개수 = 올림(배점 ÷ 5), 최대 8개다.
  예) 24점 → 5개 이상 · 16점 → 4개 이상 · 14점 → 3개 이상 · 10점 → 2개 이상 · 6점 → 2개 이상.
  요소를 억지로 쪼개라는 뜻이 아니다 — 배점이 크다는 것은 확인할 내용이 그만큼 많다는 뜻이므로,
  만점 기준을 더 잘게 나누어 적으면 개수는 자연히 채워진다.
- ★ criteria·elements·level_examples는 판단 형용사로 쓰지 않는다 — '우수하다·충실하다·타당하다·미흡하다'는
  채점자마다 다르게 읽혀 점수가 흔들린다. 채점자가 답안에서 눈으로 확인할 수 있는 사실로 적는다:
  무엇을 몇 개 다뤘는가, 어떤 연결(인과·비교·반박)을 했는가, 어떤 근거를 인용했는가.
  예) "논지 전개가 우수함" (금지) → "(다)의 주장 두 가지를 각각 (가)의 개념을 근거로 반박함" (올바름)
- 요소를 적은 영역에는 element_scale(충족 개수 → 점수 표)도 함께 적는다.
  학교 채점기준표가 쓰는 방식이다 — 예: 요소 4개·배점 20점이면
  [{"min":4,"points":20},{"min":3,"points":15},{"min":2,"points":10},{"min":1,"points":5},{"min":0,"points":3}].
  · min은 '충족 요소 몇 개 이상'이며, 가장 큰 min의 points는 그 영역 배점과 같아야 한다.
  · 아래로 갈수록 점수가 낮아지게 하고, min:0에는 방향은 맞았으나 내용이 어긋난 답안에 줄
    부분 점수(배점의 10~15%)를 적는다. 부분 점수를 줄 필요가 없으면 min:0의 points는 0으로 둔다.
  · ★ 요소 개수마다 한 줄씩 빠짐없이 적고, **위아래 줄의 점수 차이가 5점을 넘지 않게** 고르게 나눈다.
    줄을 건너뛰거나 한 줄에서 점수가 크게 떨어지면 그만큼 채점이 거칠어진다.
- 감점 기준(deduction_rules)은 각각 특정 루브릭 영역(area)에 연결.
- 감점 기준에는 표준 코드명을 우선 사용한다:
  D-LEN 분량 오류, D-KEY 필수 키워드 누락, D-SYM 제시문 기호·개념 연결 오류,
  D-REP 반복 문장, D-COPY 제시문·모범답안 단순 베껴쓰기, D-LOGIC 논리 비약,
  D-CASE 사례 적용 부족, D-OPINION 자기 견해 부족, D-SPELL 맞춤법·띄어쓰기.
- 감점 기준은 일반론이 아니라 **이 문항에서 실제로 나올 오답 유형**으로 적는다.
  대학 채점기준표가 그렇게 쓴다 — "논제1에서 '인간관의 차이'를 다루지 않고 장단점만 나열",
  "자료 수치를 인용하지 않고 서술만으로 논증", "반론을 언급만 하고 대응 없이 종료",
  "자료가 지지하는 범위를 넘어 단정", "지표의 분모를 혼동" 같은 식이다.
  이런 문항별 오답 유형을 3~5개 만들고, 각각 desc에 무엇을 빠뜨렸는지 한 문장으로 적는다.
- 동일 오류 중복 감점 금지 원칙을 전제로 설계하고, 총 감점 상한을 -25점 안쪽으로 잡는다.
- cap_rules에는 핵심 요구 누락 시 최대점을 적는다. 예: 반론이 없으면 해당 문제 최대 70%,
  사례 적용이 없으면 해당 문제 최대 65%, 자기 견해가 없으면 해당 문제 최대 75%,
  필수 키워드가 절반 이상 빠지면 전체 최대 C수준.
- ★ 모범답안은 문제마다 따로 쓴다 — model_answer.parts에 문제 수만큼 넣고,
  각 part의 q에 문제 번호를, text에 그 문제의 모범답안 전문을 담는다.
  각 part는 그 문제의 min_chars~max_chars 분량을 지킨다. 문제를 건너뛰지 않는다.
- 모범답안과 다른 결론이라도 제시문에 근거한 논리가 타당하면 인정한다는 지침을
  model_answer.alternative_positions_guide에 구체적으로 서술.

sage_note:"※ 제시문은 출제자 집필문이며, 학교 사례와 수치는 출제용 가상 자료임",passages:[{id:"가",title:"",text:"헌법은 인간의 존엄과 자유를 보장하기 위하여 표현의 자유, 사생활의 비밀과 자유, 신체의 자유 등 기본권을 규정한다. 그러나 기본권이 언제나 절대적으로 보장되는 것은 아니다. 헌법 제37조 제2항에 따르면 국가안전보장, 질서유지 또는 공공복리를 위하여 필요한 경우 법률로써 기본권을 제한할 수 있다. 이때 제한은 목적이 정당해야 하고, 목적을 이루는 데 적합해야 하며, 덜 침해적인 방법이 없는지를 살펴야 한다. 또한 제한으로 얻는 공익이 침해되는 권리보다 커야 한다. 이러한 판단을 비례성 심사 또는 과잉 금지 원칙이라고 한다. 따라서 안전을 내세운다는 이유만으로 모든 정보 수집이나 행동 통제가 허용되는 것은 아니며, 제한의 범위와 기간도 필요한 만큼으로 한정되어야 한다.",source_note:"자체 제작"},{id:"나",title:"",text:"어느 고등학교는 외부인 출입을 줄이기 위해 학생증 태그 장치를 설치하고, 출입 기록을 30일 동안 보관하였다. 시행 전 한 달과 시행 후 한 달을 비교한 결과, 외부인 무단 출입 의심 사례는 20건에서 8건으로 줄었고, 출입 확인에 걸린 평균 시간은 18초에서 11초로 감소하였다. 반면 학생이 출입 과정에서 불편을 느낀다는 응답은 32%에서 19%로 줄었지만, 자신의 출입 시간이 기록되는 것이 불안하다는 응답은 14%에서 27%로 늘었다. 조사 담당자는 장치 설치와 무단 출입 감소 사이에 관련성이 나타났다고 보았다. 다만 날씨가 나빠 외부인의 학교 방문 자체가 줄었을 가능성과, 보안 인력이 함께 늘었다는 점도 조사 결과에 영향을 주었을 수 있다고 덧붙였다. 학교는 다음 학기에 얼굴 인식 장치를 추가할지를 논의하고 있다.",source_note:"자체 제작"}],questions:[{id:"1",prompt:"(가)와 (나)를 바탕으로 학생증 태그 장치 설치 전후의 변화를 수치와 단위로 계산하여 해석하고, 그 변화가 장치 설치 때문에 나타났다고 단정할 수 있는지 판단하시오. 또한 출입 기록 보관이 학생의 어떤 기본권을 제한할 수 있는지 밝히고, 헌법상 과잉 금지 원칙과 비례성의 관점에서 공공복리를 위한 제한의 조건을 설명하시오. 답안에는 반드시 ‘기본권’, ‘과잉 금지 원칙’, ‘공공복리’, ‘비례성’, ‘헌법’이라는 다섯 핵심 키워드를 모두 포함하여 해석하고 그 까닭을 서술하시오.",points:25,min_chars:540,max_chars:660},{id:"2",prompt:"학교가 얼굴 인식 장치를 설치하여 모든 학생의 얼굴 정보와 출입 시간을 1년 동안 보관하려는 상황에 (가)의 원칙과 (나)의 자료를 적용하여 자신의 견해를 서술하시오. 먼저 이 정책이 해결하려는 문제와 새롭게 침해할 수 있는 권리를 규정하고, 목적의 정당성·수단의 적합성·침해의 최소성·법익의 균형성을 검토하시오. 그 결과를 근거로 학교가 시행할 수 있는 구체적인 해결 방안을 제시하고, 예상되는 한계와 그에 대한 보완책을 함께 쓰시오. 답안에는 반드시 ‘기본권’, ‘과잉 금지 원칙’, ‘공공복리’, ‘비례성’, ‘헌법’이라는 다섯 핵심 키워드를 모두 포함하여 해결 방안을 제시하시오.",points:35,min_chars:720,max_chars:880}],model_answer:{parts:[{q:"1",text:"학생증 태그 장치 설치 뒤 외부인 무단 출입 의심 사례는 20건에서 8건으로 12건 감소했으며, 감소율은 12÷20×100=60%이다. 평균 출입 확인 시간은 18초에서 11초로 7초 줄어 약 38.9% 감소했다. 불편하다는 응답은 32%에서 19%로 13%포인트 감소했지만, 출입 기록에 불안을 느낀다는 응답은 14%에서 27%로 13%포인트 증가했다. 따라서 장치가 출입 통제를 빠르게 하고 의심 사례를 줄이는 데 관련되었을 가능성은 있다. 그러나 날씨 때문에 방문자가 줄었고 보안 인력도 늘었으므로, 사례 감소가 오직 장치 설치 때문에 발생했다고 단정할 수는 없다. 출입 기록은 개인의 이동 정보와 관련되므로 사생활의 비밀과 자유라는 기본권을 제한할 수 있다. 학교의 안전 확보는 공공복리를 위한 정당한 목적이 될 수 있지만, 헌법에 따라 제한은 법률에 근거해야 하고 필요한 범위 안에 머물러야 한다. 과잉 금지 원칙에 따르면 장치가 목적 달성에 적합한지, 기록을 짧게 보관하거나 필요한 경우에만 확인하는 덜 침해적인 방법이 있는지 살펴야 한다. 또한 안전이라는 이익이 학생들의 사생활 침해보다 큰지 비례성을 따져야 한다. 그러므로 현재 자료만으로는 태그 장치를 일정 범위에서 유지할 수 있지만, 기록의 보관 기간과 접근 권한을 제한해야 한다."},{q:"2",text:`얼굴 인식 장치의 목적은 외부인의 무단 출입을 막고 위급 상황에 신속히 대응하는 것이다. 이는 학교 구성원의 안전이라는 공공복리와 관련되므로 목적 자체는 정당할 수 있다. 그러나 모든 학생의 얼굴 정보와 출입 시간을 1년 동안 보관하면 사생활의 비밀과 자유, 개인정보에 관한 자기결정과 관련된 기본권을 넓게 제한하게 된다. (나)에서 태그 장치 시행 후 의심 사례는 20건에서 8건으로 60% 감소했지만, 날씨와 보안 인력 증가의 영향도 있었다. 따라서 얼굴 인식이 반드시 추가 안전 효과를 낸다고 단정하기 어렵다. 목적의 정당성은 인정되더라도, 기존 태그 장치와 보안 인력만으로도 일정한 효과가 있었다면 전교생의 얼굴 정보를 장기간 수집하는 수단은 적합성과 필요성에서 다시 검토해야 한다. 헌법상 과잉 금지 원칙과 비례성에 비추어 볼 때, 얻는 안전 이익보다 권리 침해가 클 가능성이 있다.

얼굴 인식 장치의 목적은 외부인의 무단 출입을 막고 위급 상황에 신속히 대응하는 것이다. 이는 학교 구성원의 안전이라는 공공복리와 관련되므로 목적 자체는 정당할 수 있다. 그러나 모든 학생의 얼굴 정보와 출입 시간을 1년 동안 보관하면 사생활의 비밀과 자유, 개인정보에 관한 자기결정과 관련된 기본권을 넓게 제한하게 된다. (나)에서 태그 장치 시행 후 의심 사례는 20건에서 8건으로 60% 감소했지만, 날씨와 보안 인력 증가의 영향도 있었다. 따라서 얼굴 인식이 반드시 추가 안전 효과를 낸다고 단정하기 어렵다. 목적의 정당성은 인정되더라도, 기존 태그 장치와 보안 인력만으로도 일정한 효과가 있었다면 전교생의 얼굴 정보를 장기간 수집하는 수단은 적합성과 필요성에서 다시 검토해야 한다. 헌법상 과잉 금지 원칙과 비례성에 비추어 볼 때, 얻는 안전 이익보다 권리 침해가 클 가능성이 있다.

학교는 우선 얼굴 인식 장치를 전면 도입하지 말고, 출입구의 태그 장치와 방문자 확인, 보안 인력 배치를 함께 운영해야 한다. 외부인 출입이 집중되는 시간대에는 방문 예약과 일회용 출입증을 사용하고, 위급 상황이 반복되는 특정 구역에서만 제한적으로 추가 장치를 시험할 수 있다. 불가피하게 얼굴 정보를 처리한다면 법적 근거와 수집 목적을 공개하고, 학생과 보호자의 의견을 수렴하며, 얼굴 원본 대신 즉시 변환된 정보나 비식별화된 기록을 사용해야 한다. 보관 기간은 1년이 아니라 안전 확인에 필요한 최소 기간으로 줄이고, 접근 권한을 담당자 몇 명으로 제한하며 정기적으로 삭제 여부를 점검해야 한다. 또한 독립적인 점검 절차와 이의 제기 창구를 마련해야 한다.

이 방안은 얼굴 인식의 편리함과 긴급 대응 속도를 충분히 얻지 못할 수 있고, 태그를 빌려주는 행위나 방문자 위장에는 약점이 있다. 그러나 이러한 한계는 순찰 강화, 무작위 출입 점검, 비상 연락 체계로 보완할 수 있다. 안전을 이유로 권리를 일괄적으로 제한하기보다 효과와 침해 정도를 계속 비교하는 것이 헌법에 맞는 해결이다. 그러므로 현재 단계에서는 전면 도입에 반대하며, 최소 수집·짧은 보관·제한적 시험을 조건으로 한 단계적 대안을 시행해야 한다.`},rubric:[{q:"1",area:"자료 해석",points:8,criteria:"세 지표의 변화량과 변화율을 수치 및 단위로 제시하고, 증가·감소 경향을 구분한다.",elements:["무단 출입 의심 사례의 12건 감소를 제시함","무단 출입 의심 사례의 60% 감소를 계산함","평균 확인 시간의 7초 감소와 약 38.9% 감소를 제시함"],element_scale:[{min:3,points:7},{min:2,points:5},{min:1,points:3},{min:0,points:1}]},{q:"1",area:"인과 추론",points:7,criteria:"자료의 관련성과 인과성을 구분하고, 장치 외의 영향 요인을 근거로 단정의 한계를 설명한다.",elements:["장치 설치와 의심 사례 감소의 관련성을 설명함","날씨 변화가 방문자 수에 미친 가능성을 제시함","보안 인력 증가를 대안적 영향 요인으로 제시함"],element_scale:[{min:3,points:7},{min:2,points:5},{min:1,points:3},{min:0,points:1}]},{q:"1",area:"헌법 원칙 적용",points:6,criteria:"출입 기록과 관련된 권리를 밝히고, 기본권 제한의 목적·필요 범위·이익 형량을 연결한다.",elements:["출입 기록이 사생활의 비밀과 자유를 제한함을 밝힘","안전 확보를 공공복리의 목적과 연결함","과잉 금지 원칙과 비례성에 따라 보관 기간을 검토함"],element_scale:[{min:3,points:6},{min:2,points:4},{min:1,points:2},{min:0,points:1}]},{q:"1",area:"표현력",points:4,criteria:"상 — 학술적 어휘가 정확하고, 비문이 없으며 주어·서술어 호응이 완벽하고, 문장 간 연결과 논리 흐름이 매끄럽다. / 중 — 어휘가 다소 통속적이나 뜻은 통하고, 경미한 비문·호응 오류가 1~2개 있으며, 문장은 이어지나 단락의 통일성이 다소 부족하다. / 하 — 어휘 오용이 잦아 뜻을 알기 어렵고, 비문이 많아 의미 분석이 어려우며, 문장 간 개연성이 없고 단락 구성이 이루어지지 않았다.",elements:["어휘력 — 학술적·논술적 어휘를 적재적소에 정확히 씀(일상어로 흐르지 않음)","문장력 — 비문이 없고 주어·서술어 호응이 맞음","단락 구성력 — 문장 간 연결이 자연스럽고 단락의 통일성이 있음"],element_scale:[{min:3,points:4},{min:2,points:2},{min:1,points:1},{min:0,points:0}]},{q:"2",area:"문제 진단",points:6,criteria:"정책의 해결 목적과 새롭게 제한되는 권리를 구분하여 제시한다.",elements:["무단 출입 방지 또는 위급 대응을 정책 목적으로 제시함","얼굴 정보와 출입 시간의 장기 수집을 설명함","사생활의 비밀과 자유의 제한을 제시함"],element_scale:[{min:3,points:6},{min:2,points:4},{min:1,points:2},{min:0,points:1}]},{q:"2",area:"헌법 원칙 적용",points:8,criteria:"정책을 목적의 정당성·수단의 적합성·침해의 최소성·법익의 균형성에 따라 검토한다.",elements:["안전 확보 목적의 정당성을 공공복리와 연결함","얼굴 인식의 안전 효과를 자료의 한계와 함께 검토함","덜 침해적인 대안의 존재를 검토함","안전 이익과 기본권 침해를 비교함"
